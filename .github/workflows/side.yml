name: side

# browsermcp.dev bygges og udgives HER, med friske tal bagt ind - uden et commit til main.
#
# Hvorfor (målt 19/10): tal.yml skubbede tallene til main, men main kræver PR + seks tjek uden undtagelse, så hvert skub blev
# afvist fra 13/10, og siden stod fast på 53 stjerner, mens GitHub havde 58. Nu går Pages-kilden via GitHub Actions: dette job
# tjekker main ud, bager stjerner, npm-hentninger og Chrome Web Store-brugere ind i docs/index.html (scripts/stjerner.py),
# genererer sitemappen igen, kører de samme tjek som før og udgiver docs/ som Pages-artefakt. Intet skrives tilbage til repoet.
#
# Kører dagligt, ved hvert skub til main der rører siden, og ved håndkørsel. Fejler en kilde eller et tjek, udgives intet,
# den forrige udgave står, og jobbet «besked» åbner én issue til et menneske (scripts/vagt-besked.sh). Actions er låst til
# SHA (som udgivelse.yml); checkout gemmer ikke tokenet, npm kører uden install-scripts, og jobbet har kun læseret til indholdet.
#
# ⛔ Kræver Settings → Pages → Source = «GitHub Actions» (før: «Deploy from a branch», main, /docs). Skift kilden først
# EFTER denne fil er flettet til main, og kør så `side` med hånden; tilbage = sæt kilden til main, /docs igen.

on:
  schedule:
    - cron: '17 5 * * *'   # 07.17 dansk sommertid
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'content/**'
      - 'scripts/stjerner.py'
      - 'scripts/generate-docs.py'
      - '.github/workflows/side.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  byg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # generate-docs.py daterer siderne efter deres seneste commit
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: bag tallene ind
        env:
          GH_TOKEN: ${{ github.token }}   # GitHub-API'et: 1.000 kald/time i stedet for 60 pr. IP (403 den 28/10)
        run: python3 scripts/stjerner.py
      - name: generer siderne igen (sitemappens lastmod)
        run: |
          python3 scripts/generate-docs.py > /dev/null
          aendret=$(git status --porcelain | awk '{print $2}' | sort | tr '\n' ' ')
          case "$aendret" in
            ""|"docs/index.html "|"docs/sitemap.xml "|"docs/index.html docs/sitemap.xml ") echo "aendret: ${aendret:-intet}" ;;
            *) echo "uventede filer efter generering: $aendret"; exit 1 ;;
          esac
      - name: tjek og proever
        env:
          GH_TOKEN: ${{ github.token }}   # GitHub-API'et: 1.000 kald/time i stedet for 60 pr. IP (403 den 28/10)
        run: |
          python3 scripts/stjerner.py --tjek
          python3 scripts/check-docs.py
          npm ci --prefix mcp-server --ignore-scripts --no-audit --no-fund
          node --test test/forside.test.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # 13/11: samme Jekyll-byg som Pages' grenudgivelse i dag, så skiftet til Actions ikke ændrer siden: uden det
      # bliver /llms-install.html (Jekyll laver den af docs/llms-install.md, live 200 i dag) til 404.
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  udgiv:
    needs: byg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.udgivelse.outputs.page_url }}
    steps:
      - id: udgivelse
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # ⛔ MAALT 13/11-2026: tal.yml var roed 32 af 32 dage (13/10-13/11), og ingen fik det at vide. En roed
  # koersel aabner derfor én issue til et menneske; samme fund dagen efter giver ingen ny besked, et nyt
  # fund gør, og den foerste groenne koersel lukker issuen (scripts/vagt-besked.sh).
  besked:
    needs: [byg, udgiv]
    if: ${{ !cancelled() }}   # som svartid (review #107 R3): en annulleret koersel er ikke et fund
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read           # kun til at laese hvilke trin der fejlede i denne koersel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: roed -> issue til et menneske, groen -> luk den
        env:
          GH_TOKEN: ${{ github.token }}
          BYG: ${{ needs.byg.result }}
          UDGIV: ${{ needs.udgiv.result }}
        # Fundet er de trin der fejlede, ikke kun jobbets udfald: tal.yml doede tre forskellige steder
        # (skub 13/10, 403 den 28/10, docs-gaten fra 30/10). Med «byg: failure» alene var en ny aarsag
        # blevet til «samme fund som sidst» og aldrig naaet nogen.
        run: |
          { echo "byg: $BYG · udgiv: $UDGIV"
            gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs \
              --jq '.jobs[] | .name as $j | .steps[]? | select(.conclusion == "failure") | "fejlede: \($j) / \(.name)"' \
              || echo "fejlede trin: kunne ikke laeses - aabn koerslen"
          } > "$RUNNER_TEMP/fund.txt"
          if [ "$BYG" = success ] && [ "$UDGIV" = success ]; then s=ok; else s=roed; fi
          bash scripts/vagt-besked.sh side "$s" "$RUNNER_TEMP/fund.txt"
