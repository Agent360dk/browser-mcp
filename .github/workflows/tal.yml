name: tal

# Daglige tal paa browsermcp.dev (Gustav 10/10: «ja til daglig stjernekoersel»). Siden lover ingen kald til
# tredjepart ved indlaesning, saa GitHub-stjerner, npm-hentninger sidste maaned og Chrome Web Store-brugere
# bages ind i docs/index.html af scripts/stjerner.py - én gang i doegnet i stedet for live i browseren.
# Vagter: skriver KUN naar et tal har aendret sig, KUN i docs/index.html, KUN naar stjerner.py --tjek siger OK
# efter indbagningen, og KUN naar forsidens proever bestaar. Fejler en kilde (fx butikssiden), bliver jobbet
# roedt, og intet skrives.
# NB: Chrome Web Store viser offentligt kun et afrundet tal («1,000 users»); det praecise staar kun i
# udviklerkonsollen, som ikke har et aabent API.

on:
  schedule:
    - cron: '17 5 * * *'   # 07.17 dansk sommertid
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: tal
  cancel-in-progress: false

jobs:
  tal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: bag tallene ind
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/stjerner.py
      - name: kun docs/index.html maa vaere aendret
        id: diff
        run: |
          aendret=$(git status --porcelain | awk '{print $2}')
          if [ -z "$aendret" ]; then echo "ingen nye tal"; echo "ny=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$aendret" != "docs/index.html" ]; then echo "uventede filer: $aendret"; exit 1; fi
          # stjerne-teksten baerer maaledatoen («GitHub stars on 10 Oct 2026»); kun datoen ny = ingen commit
          if git show HEAD:docs/index.html | sed -E 's/ on [0-9]{1,2} [A-Z][a-z]{2} 20[0-9]{2}//g' > /tmp/foer.html \
             && sed -E 's/ on [0-9]{1,2} [A-Z][a-z]{2} 20[0-9]{2}//g' docs/index.html > /tmp/efter.html \
             && cmp -s /tmp/foer.html /tmp/efter.html; then
            echo "kun datoen er ny"; git checkout -- docs/index.html; echo "ny=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ny=1" >> "$GITHUB_OUTPUT"
      - name: tjek og proever
        if: steps.diff.outputs.ny == '1'
        run: |
          python3 scripts/stjerner.py --tjek
          npm install --prefix mcp-server --no-audit --no-fund
          node --test test/forside.test.mjs
      - name: commit og skub
        if: steps.diff.outputs.ny == '1'
        run: |
          git config user.name "browsermcp-tal[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "tal: stjerner, npm og Chrome Web Store $(date -u +%Y-%m-%d)"
          git push origin HEAD:main
      - name: byg siden (et skub med GITHUB_TOKEN starter ikke altid Pages)
        if: steps.diff.outputs.ny == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages-bygget kunne ikke bestilles; det naeste skub bygger"
