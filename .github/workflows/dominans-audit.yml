name: dominans-audit

# Monthly, model-free distribution + competition watch for Browser MCP by Agent360.
# Runs entirely on GitHub's infrastructure (no AI vendor, no machine to keep awake).
#
# Two signals, deliberately:
#   1. A monthly ISSUE with the full report — so the run reaches a human every month,
#      including the reminder to run the manual AI-citations panel. Without this, a
#      green month is silent and the reminder never lands.
#   2. A FAILED run on any 🔴 finding (registry drift, catalog regression, or the dead
#      twin browsermcp.io resurrecting) — GitHub emails the repo owner.
#
# Manual run any time from the Actions tab (workflow_dispatch).

on:
  schedule:
    - cron: "0 7 1 * *"   # 1st of each month, 07:00 UTC = 09:00 Europe/Copenhagen
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    # If these secrets are set, the monthly report is emailed and no issue is created.
    # If they are not, the workflow falls back to posting the issue (see steps below),
    # so it keeps working whether or not SendGrid is wired up yet.
    env:
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
      SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - name: Run dominans-audit
        id: audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 scripts/dominans-audit.py | tee /tmp/audit-report.txt
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          set -e

      # Preferred delivery: email via SendGrid. Runs only when the key is configured,
      # so the report reaches a human every month (green nudge or red alarm) without
      # creating a GitHub issue to close.
      - name: Email monthly report (SendGrid)
        if: always() && env.SENDGRID_API_KEY != ''
        env:
          AUDIT_STATUS: ${{ steps.audit.outputs.status }}
          MAIL_TO: gustav@agent360.dk
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          green = os.environ.get("AUDIT_STATUS", "0") == "0"
          report = open("/tmp/audit-report.txt", encoding="utf-8").read()
          subject = ("✅ Browser MCP — månedstjek OK (husk citations-måling)" if green
                     else "\U0001F534 Browser MCP — handling påkrævet (drift fundet)")
          intro = ("Månedstjekket for browsermcp.dev kørte — ingen drift eller regression.\n\n"
                   "\U0001F449 Det eneste manuelle: kør 16-prompt AI-citations-panelet "
                   "(kræver din indloggede browser). Ark: plans/SEO/research/citations-run-*.md\n\n"
                   if green else
                   "Månedstjekket for browsermcp.dev fandt et problem — se rapporten nedenfor.\n\n")
          payload = {
              "personalizations": [{"to": [{"email": os.environ["MAIL_TO"]}]}],
              "from": {"email": os.environ["SENDGRID_FROM_EMAIL"]},
              "subject": subject,
              "content": [{"type": "text/plain", "value": intro + report}],
          }
          req = urllib.request.Request(
              "https://api.sendgrid.com/v3/mail/send",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Authorization": "Bearer " + os.environ["SENDGRID_API_KEY"],
                       "Content-Type": "application/json"},
              method="POST")
          with urllib.request.urlopen(req) as r:
              print("SendGrid accepted:", r.status)
          PY

      # Fallback delivery: post an issue, but ONLY when SendGrid is not configured,
      # so we never double-notify once email is wired up.
      - name: Post monthly report as an issue (fallback)
        if: always() && env.SENDGRID_API_KEY == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MONTH=$(date -u +'%Y-%m')
          {
            echo "Automated monthly distribution + competition watch for browsermcp.dev."
            echo "Model-free: a plain script on GitHub's schedule, no AI vendor involved."
            echo
            echo '```'
            cat /tmp/audit-report.txt
            echo '```'
            echo
            echo "_Close this issue once read. Next run: 1st of next month, 09:00 Europe/Copenhagen._"
          } > /tmp/issue-body.md
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Dominans-audit — $MONTH" \
            --body-file /tmp/issue-body.md

      - name: Fail the run if the audit found a 🔴
        if: steps.audit.outputs.status != '0'
        run: |
          echo "::error::dominans-audit reported a 🔴 finding — see the report (email or issue)"
          exit 1
