name: tests

# MAALT 22/8: 108 tests laa i repoet, og INGEN workflow koerte dem. De blev kun koert
# i haanden og af release-scriptet - altsaa foerst naar udgivelsen allerede var i gang.
# Tests der aldrig koerer paa en PR er dokumentation, ikke en gate.
#
# Kun det statiske lag koerer her. De to Chrome-harnesser (npm run flow / run sessions)
# kraever en rigtig browser med udvidelsen indlaest og hoerer hjemme i haanden.

on:
  push:
    branches: [main]
  pull_request:

# MAALT 11/9: pakken lover Node 18+ ("engines"), men kun Node 20 blev testet, og aldrig paa macOS
# eller Windows. README'en giver Windows-instruktioner. actions/*@v4 koerer paa Node 20, som GitHub
# udfaser (advarsel i hver koersel).
jobs:
  static:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v5
        with:
          # Generatoren udleder datePublished/dateModified med 'git log', og
          # release-coherence-testen laeser 'git tag'. En shallow klon har hverken
          # historik eller tags - saa begge porte fejlede paa noget der var i orden.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: install
        run: npm install --prefix mcp-server --no-audit --no-fund
      - name: node --test
        run: npm --prefix mcp-server test

  # Andre platforme MAALES, men blokerer ikke endnu: Windows er aldrig koert, og testene bruger
  # symlinks og hardlinks. Naar jobbet er groent, flyttes det ind i matrixen ovenfor.
  andre-platforme:
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # MAALT 13/9: `npm install --prefix mcp-server` doede paa Windows med
      # "ENOENT ... D:\a\browser-mcp\browser-mcp\package.json". npm laeser roden foerst,
      # og der ER ingen package.json i roden - pakken ligger i mcp-server/. Paa Linux og macOS
      # tolereres det; paa Windows goer det ikke. `working-directory` undgaar roden helt.
      - name: install
        working-directory: mcp-server
        run: npm install --no-audit --no-fund
      - name: node --test
        working-directory: mcp-server
        run: npm test
