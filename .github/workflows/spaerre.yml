name: spaerre

# Flow-spaerren i sin EGEN browser - paa en Mac hos GitHub i stedet for paa Gustavs.
#
# Hvorfor den findes: udgivelsen maa ikke kunne gaa ud uden at alle 40 vaerktoejer er koert mod
# en rigtig browser (Gustavs egen sikkerhedsautomatik afviste en udgivelse uden spaerre 23/9).
# Indtil nu kunne spaerren kun koere paa hans maskine. Det er fundamentet under en udgivelse
# uden npm-noegle: en arbejdsgang kan ikke udgive paa noget spaerren ikke har godkendt.
#
# Hvorfor macos-latest og ikke Linux (anbefalet af Fable 24/9): det er byte-for-byte det miljoe
# spaerren er maalt groen i - Chrome for Testing til mac-arm64. Linux har sandbox-begraensninger
# i nyere Ubuntu og er langsommere, og spaerren har forbigaaende opstartsfejl der bliver VAERRE
# paa en langsommere maskine. Repoet er offentligt, saa Mac-maskinerne koster intet.
on:
  # 26/9: haandkoersel kan maale det der ER udgivet (kriterie 1): butikkens udvidelse og/eller
  # npm-serveren i en given version. Tom = kandidatens egen kode, som ved PR og udgivelse.
  workflow_dispatch:
    inputs:
      udvidelse_fra_butik:
        description: 'Version fra Chrome Web Store, fx 1.30.1 (tom = repoets udvidelse)'
        required: false
        default: ''
      server_fra_npm:
        description: 'Version fra npm, fx 1.30.1 (tom = repoets server)'
        required: false
        default: ''
      # 27/9: udgivelsens port 2c kraever en aerligheds-maaling af den kode der udgives. Den kunne kun
      # tages paa Gustavs Mac, og den lokale maaler fejlede 26/9 og igen 27/9. Her tages den paa samme
      # maskine som spaerren - og dens MAALT-COMMIT/AERLIGHED-DOM kopieres ind i en RESULTAT-fil.
      aerlighed:
        description: 'Tag ogsaa aerligheds-maalingen af vores eget vaerktoej (test/aerlighed/maal.mjs --kun os)'
        type: boolean
        default: false
  # Kaldes af udgivelses-arbejdsgangen, saa en udgivelse ikke kan starte uden en groen spaerre.
  workflow_call:
    inputs:
      ref:
        description: 'Commit/tag der testes (tom = den der udloeste koerslen). Genoptagelse sender tagget.'
        type: string
        default: ''
    # Astra runde 6 (1/10): udgivelsen skal vide HVILKEN commit spaerren faktisk testede, saa kandidaten kan afvise en anden (et flyttet tag).
    outputs:
      sha:
        description: 'Den commit spaerren faktisk testede (git rev-parse HEAD efter checkout)'
        value: ${{ jobs.spaerre.outputs.sha }}
  # 25/9: INGEN stifilter. Spaerren skal kunne vaere et paakraevet tjek paa main, og et paakraevet
  # tjek der aldrig starter, staar som «Expected» for evigt - saa kan en PR der kun roerer docs
  # aldrig merges. Et filter der springer den over er en port der aldrig kan passere.
  pull_request:

permissions:
  contents: read

jobs:
  spaerre:
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Aerligheds-trinnet og docs-vagten laeser git-historik og tags.
          fetch-depth: 0
          # Tom ved PR/dispatch (= den udloesende commit); tagget ved genoptagelse af en udgivelse.
          ref: ${{ inputs.ref || '' }}

      - name: den testede commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: installer serveren
        run: npm install --prefix mcp-server --no-audit --no-fund

      # Chrome for Testing er ~150 MB. Uden cache hentes den ved hver koersel.
      - name: cache Chrome for Testing
        uses: actions/cache@v6
        with:
          path: chrome
          key: cft-${{ runner.os }}-${{ runner.arch }}-stable

      - name: hent det udgivne (kun ved haandkoersel med version)
        id: hent
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.udvidelse_fra_butik != '' || inputs.server_fra_npm != '') }}
        env:
          UDVIDELSE: ${{ inputs.udvidelse_fra_butik }}
          SERVER: ${{ inputs.server_fra_npm }}
        run: |
          git fetch -q --tags origin
          # Til trinnets OUTPUTS, ikke $GITHUB_ENV: spaerretrinnet laeser kun dette trins beviste stier (Astra 27/9).
          python3 scripts/hent-udgivet.py --udvidelse "$UDVIDELSE" --server "$SERVER" --ud "$RUNNER_TEMP/udgivet" >> "$GITHUB_OUTPUT"

      - name: spaerren, isoleret
        # ⛔ 27/9 (Astra, PR #32 R2): uden `shell:` koerer GitHub `bash -e` UDEN pipefail, saa
        # `node ... | tee` fik tee's exitkode. Et flow med 1 FEJL og fuld daekning blev groent,
        # fordi flow_daekning_ok kun ser daekning, oversprungne og ugyldige maalinger.
        # `shell: bash` = `bash --noprofile --norc -eo pipefail {0}`.
        shell: bash
        env:
          # Sat EKSPLICIT paa trinnet fra hent-trinnets outputs - tomme naar det ikke koerte. Et arvet
          # UDGIVET_* i miljoeet kan derfor ikke genaktivere en fremmed kandidat (Astra 27/9).
          UDGIVET_UDVIDELSE: ${{ steps.hent.outputs.UDGIVET_UDVIDELSE }}
          UDGIVET_SERVER: ${{ steps.hent.outputs.UDGIVET_SERVER }}
        run: |
          . scripts/flow-daekning.sh
          flow_nulstil_arv
          # Det udgivne saettes EFTER nulstillingen og kun fra hent-trinnets egne, beviste stier.
          [[ -n "${UDGIVET_UDVIDELSE:-}" ]] && export BMCP_UDVIDELSE_KILDE="$UDGIVET_UDVIDELSE"
          [[ -n "${UDGIVET_SERVER:-}" ]] && export BMCP_SERVER_INDEX="$UDGIVET_SERVER"
          echo "udvidelse: ${BMCP_UDVIDELSE_KILDE:-repoets} · server: ${BMCP_SERVER_INDEX:-repoets}"
          # Exitkoden fanges (ikke -e's straks-stop), saa daekningsdommen stadig skrives foer roedt.
          if node scripts/flow-isoleret.mjs --spaerre 2>&1 | tee spaerre.log; then FLOW_KODE=0; else FLOW_KODE=$?; fi
          if ! grund="$(flow_daekning_ok spaerre.log)"; then
            echo "::error::flow-spaerren daekkede ikke alt: $grund"
            exit 1
          fi
          # Daekningen er ikke hele dommen: flowet selv svarer 1 ved FEJL eller fejlede fane-skift, 3 hvis
          # selen kastede. Udgivelses-scriptet taeller FEJL-listen; her er flowets eget svar dommen.
          if [[ "$FLOW_KODE" != 0 ]]; then
            echo "::error::flow-spaerren endte med exit $FLOW_KODE: $(sed -n '/^FEJL:/,/^====/p' spaerre.log | sed -n '2,4p' | tr '\n' ' ')"
            exit 1
          fi
          grep -m1 '^DAEKNING:' spaerre.log
          # Loggen skal BEVISE at det udgivne blev maalt - ikke kun at variablen var sat.
          if [[ -n "${UDGIVET_UDVIDELSE:-}" ]] && ! grep -qxF "MAALT-UDVIDELSE: $UDGIVET_UDVIDELSE" spaerre.log; then
            echo "::error::spaerren maalte ikke butikkens udvidelse ($UDGIVET_UDVIDELSE)"; exit 1
          fi
          if [[ -n "${UDGIVET_SERVER:-}" ]]; then
            for maerke in MAALT-SERVER FLOW-SERVER; do
              grep -qxF "$maerke: $UDGIVET_SERVER" spaerre.log || { echo "::error::$maerke er ikke npm-serveren ($UDGIVET_SERVER)"; exit 1; }
            done
          fi

      - name: aerligheds-maalingen (kun ved haandkoersel med aerlighed)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.aerlighed }}
        shell: bash
        run: |
          . scripts/flow-daekning.sh
          flow_nulstil_arv
          if AERLIGHED_MED_OS=1 node scripts/flow-isoleret.mjs --koer test/aerlighed/maal.mjs --kun os 2>&1 | tee aerlighed.log; then KODE=0; else KODE=$?; fi
          # Linjerne der kopieres ORDRET ind i RESULTAT-filen (udgivelsens 2c-port laeser dem).
          grep -E '^(MAALT-COMMIT|AERLIGHED-DOM):' aerlighed.log || true
          if [[ "$KODE" != 0 ]]; then
            echo "::error::aerligheds-maalingen endte med exit $KODE - en LOEGN, eller ingen maaling"
            exit 1
          fi

      - name: gem loggen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spaerre-log
          path: |
            spaerre.log
            aerlighed.log
          retention-days: 14
