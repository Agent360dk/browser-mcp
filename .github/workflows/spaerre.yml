name: spaerre

# Flow-spaerren i sin EGEN browser - paa en Mac hos GitHub i stedet for paa Gustavs.
#
# Hvorfor den findes: udgivelsen maa ikke kunne gaa ud uden at alle 40 vaerktoejer er koert mod
# en rigtig browser (Gustavs egen sikkerhedsautomatik afviste en udgivelse uden spaerre 23/9).
# Indtil nu kunne spaerren kun koere paa hans maskine. Det er fundamentet under en udgivelse
# uden npm-noegle: en arbejdsgang kan ikke udgive paa noget spaerren ikke har godkendt.
#
# Hvorfor macos-latest og ikke Linux (anbefalet af Fable 24/9): det er byte-for-byte det miljoe
# spaerren er maalt groen i - Chrome for Testing til mac-arm64. Linux har sandbox-begraensninger
# i nyere Ubuntu og er langsommere, og spaerren har forbigaaende opstartsfejl der bliver VAERRE
# paa en langsommere maskine. Repoet er offentligt, saa Mac-maskinerne koster intet.
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'extension/**'
      - 'mcp-server/**'
      - 'test/flow/**'
      - 'scripts/flow-isoleret.mjs'
      - 'scripts/flow-daekning.sh'

permissions:
  contents: read

jobs:
  spaerre:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Aerligheds-trinnet og docs-vagten laeser git-historik og tags.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: installer serveren
        run: npm install --prefix mcp-server --no-audit --no-fund

      # Chrome for Testing er ~150 MB. Uden cache hentes den ved hver koersel.
      - name: cache Chrome for Testing
        uses: actions/cache@v4
        with:
          path: chrome
          key: cft-${{ runner.os }}-${{ runner.arch }}-stable

      - name: spaerren, isoleret
        run: |
          . scripts/flow-daekning.sh
          flow_nulstil_arv
          node scripts/flow-isoleret.mjs --spaerre 2>&1 | tee spaerre.log
          # Samme dom som udgivelses-scriptet - ét sted, ikke en kopi.
          if ! grund="$(flow_daekning_ok spaerre.log)"; then
            echo "::error::flow-spaerren daekkede ikke alt: $grund"
            exit 1
          fi
          grep -m1 '^DAEKNING:' spaerre.log

      - name: gem loggen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spaerre-log
          path: spaerre.log
          retention-days: 14
